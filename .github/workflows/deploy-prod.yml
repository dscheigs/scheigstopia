name: Deploy to production

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag, or SHA to deploy
                required: false
                default: main

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read

env:
    VERCEL_CLI: vercel@59.11.7

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_SCHEIGSTOPIA_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

            - run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

            - run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
