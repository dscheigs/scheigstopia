name: Deploy to production

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag, or SHA to deploy
                required: false
                default: main

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_SCHEIGSTOPIA_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}
                  persist-credentials: false

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Server-side build: uploads source and builds on Vercel using the
            # project's dashboard settings (Root Directory, vercel.json). A
            # project-scoped token can deploy but can't read the project-settings
            # API that `vercel pull` / `build --prebuilt` need.
            - run: pnpm exec vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN"
