name: Deploy to production

# Manual deploy of one app, or all of them. Each app has its own GitHub
# environment (production-<app>) holding that app's Vercel secrets:
# VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID. Each environment should
# allow deployments from `main` only and require a reviewer.
#
# To add an app: add it to `options` and to the `all` list below, create a
# `production-<app>` environment, and add the app's Vercel project.
on:
    workflow_dispatch:
        inputs:
            app:
                description: App to deploy
                type: choice
                default: scheigstopia
                options:
                    - all
                    - scheigstopia
                    - grimoire

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy ${{ matrix.app }}
        runs-on: ubuntu-latest
        environment: production-${{ matrix.app }}
        strategy:
            fail-fast: false
            matrix:
                app: ${{ fromJSON(inputs.app == 'all' && '["scheigstopia","grimoire"]' || format('["{0}"]', inputs.app)) }}
        steps:
            # Always deploys the ref this workflow was started from. The
            # environment only allows `main`, so there is no way to deploy
            # another branch with these secrets.
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Server-side build: uploads source and builds on Vercel using the
            # project's dashboard settings (Root Directory, vercel.json). A
            # project-scoped token can deploy but can't read the project-settings
            # API that `vercel pull` / `build --prebuilt` need.
            #
            # The credentials are set on this step only, so checkout and
            # `pnpm install` (which runs dependency install scripts) never see them.
            - name: Deploy to Vercel
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: pnpm exec vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN"
