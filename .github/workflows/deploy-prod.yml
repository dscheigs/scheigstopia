name: Deploy to production

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag, or SHA to deploy
                required: false
                default: main

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            VERCEL_TOKEN: ${{ secrets.VERCEL_SCHEIGSTOPIA_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

            - run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

            - run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
