name: Refresh Grimoire card list

# Rebuilds the card list from Scryfall, checks it is sane, and, if it changed,
# uploads it to a public Vercel Blob. Grimoire reads it from there, so a refresh
# needs no PR and no deploy. The job never touches main.
#
# Needs the BLOB_READ_WRITE_TOKEN repository secret (token of the public Blob
# store). Optionally set the CARD_NAMES_URL repository variable to the list's
# public URL so unchanged lists are detected and the sanity check compares with
# what is live. See apps/grimoire/README.md, "Refreshing the card list".
on:
    schedule:
        - cron: '17 6 * * 1' # Mondays, 06:17 UTC
    workflow_dispatch:

concurrency:
    group: refresh-card-names
    cancel-in-progress: false

permissions:
    contents: read

env:
    LIST: apps/grimoire/public/data/card-names.json

jobs:
    refresh:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Keep the committed list as the fallback baseline
              run: cp "$LIST" "$RUNNER_TEMP/previous-card-names.json"

            - name: Rebuild the list from Scryfall
              run: pnpm exec nx run grimoire:card-names

            - name: Check the new list is sane
              run: node apps/grimoire/scripts/checkCardNameRefresh.mjs "$RUNNER_TEMP/previous-card-names.json"

            - name: Upload the list to Vercel Blob
              env:
                  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
                  CARD_NAMES_URL: ${{ vars.CARD_NAMES_URL }}
              run: node apps/grimoire/scripts/publishCardNames.mjs "$RUNNER_TEMP/previous-card-names.json"
